<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="position:relative;display:flex;flex-direction:column;gap:0;background:{{ card.surface }};border:1px solid {{ card.border }};border-radius:16px;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease;cursor:pointer" style-hover="transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(0,0,0,.35)" onClick="{{ onView }}">
  <div style="position:relative;aspect-ratio:4/3;overflow:hidden">
    <image-slot id="{{ product.img }}" shape="rect" placeholder="{{ product.title }}"></image-slot>
    <sc-if value="{{ product.badge }}">
      <div style="position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;font:600 11px/1 {{ card.uiFont }};letter-spacing:.02em;background:{{ badgeBg }};color:{{ badgeColor }};backdrop-filter:blur(6px)">{{ product.badge }}</div>
    </sc-if>
    <button onClick="{{ onToggleWishlist }}" style="position:absolute;top:10px;right:10px;width:32px;height:32px;border:none;border-radius:999px;background:rgba(20,18,16,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer" aria-label="Toggle wishlist">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="#fff" stroke-width="1.6"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2 4.8 5.6 4c2.1-.5 4.2.4 5.4 2.2C12.2 4.4 14.3 3.5 16.4 4c3.6.8 5.1 4.4 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg>
    </button>
    <div style="position:absolute;inset:auto 0 0 0;padding:10px;display:flex;justify-content:center;opacity:0;transition:opacity .2s ease" style-hover="opacity:1" className="qp-row">
      <button onClick="{{ onQuickView }}" style="padding:8px 14px;border:none;border-radius:999px;background:rgba(20,18,16,.7);backdrop-filter:blur(8px);color:#fff;font:500 12px {{ card.uiFont }};display:flex;align-items:center;gap:6px;cursor:pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg>
        Quick preview
      </button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;padding:16px">
    <div style="font:500 11.5px {{ card.uiFont }};color:{{ card.textDim }};display:flex;justify-content:space-between;gap:8px">
      <span>{{ product.category }}</span>
      <span>{{ product.creator }}</span>
    </div>
    <div style="font:600 15.5px/1.3 {{ card.displayFont }};color:{{ card.text }}">{{ product.title }}</div>
    <div style="display:flex;align-items:center;gap:6px;font:500 12px {{ card.uiFont }};color:{{ card.textDim }}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="{{ card.accentSoft }}" stroke="none"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 16.9 5.8 20.3l1.6-6.8L2.2 8.9l6.9-.6z"/></svg>
      <span>{{ product.rating }}</span>
      <span style="opacity:.5">·</span>
      <span>{{ salesLabel }}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font:700 17px {{ card.displayFont }};color:{{ card.text }}">{{ displayPrice }}</span>
        <sc-if value="{{ product.sale }}"><span style="font:500 13px {{ card.uiFont }};color:{{ card.textDim }};text-decoration:line-through">{{ strikePrice }}</span></sc-if>
      </div>
      <button onClick="{{ onAddCart }}" style="width:34px;height:34px;border:none;border-radius:10px;background:{{ card.accent }};color:{{ card.accentText }};display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="filter:brightness(1.08)" aria-label="Add to cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      </button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:380},&quot;product&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;card&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;wishlisted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onAddCart&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p:any)=&gt;void&quot;},&quot;onToggleWishlist&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p:any)=&gt;void&quot;},&quot;onView&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(p:any)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.product || {};
    const card = this.props.card || {};
    const wishlisted = !!this.props.wishlisted;
    const badgeMap = {
      Sale: { bg: card.accentSoft || '#e2c98a', color: card.accentSoftText || '#1a1512' },
      New: { bg: card.text, color: card.surface },
      Trending: { bg: card.accent, color: card.accentText },
      Featured: { bg: card.accent, color: card.accentText },
    };
    const b = badgeMap[p.badge] || { bg: card.accent, color: card.accentText };
    return {
      product: p,
      card,
      badgeBg: b.bg,
      badgeColor: b.color,
      heartFill: wishlisted ? '#fff' : 'none',
      displayPrice: '$' + (p.sale != null ? p.sale : p.price).toFixed(2).replace(/\.00$/, ''),
      strikePrice: '$' + (p.price != null ? p.price.toFixed(2).replace(/\.00$/, '') : ''),
      salesLabel: (p.sales || 0).toLocaleString() + ' sales',
      onAddCart: (e) => { e.stopPropagation(); this.props.onAddCart && this.props.onAddCart(p); },
      onToggleWishlist: (e) => { e.stopPropagation(); this.props.onToggleWishlist && this.props.onToggleWishlist(p); },
      onQuickView: (e) => { e.stopPropagation(); this.props.onView && this.props.onView(p); },
      onView: () => { this.props.onView && this.props.onView(p); },
    };
  }
}
</script>
</body>
</html>
